
; ──────────────────────────────────────────────
; PHP Upload Configuration for Faculty Task Management System
; This file overrides php.ini settings for this application.
; ──────────────────────────────────────────────

; Maximum size of an uploaded file (must be >= your app's max upload limit)
upload_max_filesize = 12M

; Maximum size of POST data (should be larger than upload_max_filesize to account for form fields)
post_max_size = 15M

; Maximum number of files that can be uploaded simultaneously
max_file_uploads = 20

; Maximum execution time in seconds (increase for large file uploads)
max_execution_time = 120

; Maximum input time in seconds (time PHP will spend parsing input data)
max_input_time = 120
